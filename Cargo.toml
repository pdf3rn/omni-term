[package]
name = "omni-term"
version = "0.1.8"
edition = "2024"
description = "Native cross-platform terminal with SSH, Telnet, serial and SFTP/FTP/SMB file connections"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pdf3rn/omni-term"
readme = "README.md"
keywords = ["terminal", "ssh", "sftp", "egui"]
categories = ["command-line-utilities"]

[package.metadata.deb]
maintainer = "pdf3rn <61333270+pdf3rn@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
# El binario carga estas librerías en tiempo de ejecución (dlopen), así que `$auto` no las detecta.
recommends = "libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libx11-6, libx11-xcb1, libxcb1, libdbus-1-3, libegl1, libvulkan1"
extended-description = "Terminal nativa con SSH, Telnet, serie y conexiones de archivos (SFTP, FTP, SMB), túneles y snippets."
assets = [
    ["target/release/omni-term", "usr/bin/", "755"],
    ["packaging/omni-term.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/16x16/omni-term.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["packaging/icons/32x32/omni-term.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["packaging/icons/48x48/omni-term.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["packaging/icons/64x64/omni-term.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["packaging/icons/128x128/omni-term.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["packaging/icons/256x256/omni-term.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["packaging/icons/512x512/omni-term.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["README.md", "usr/share/doc/omni-term/README", "644"],
]

[dependencies]
ab_glyph = "0.2.32"
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
arboard = "3.7.0"
argon2 = "0.6.0"
async-trait = "0.1.92"
base64 = "0.23"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
eframe = "0.37.0"
fontdb = "0.24.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
keyring = "4.2.0"
notify-rust = "4.18.2"
open = "5.4.4"
portable-pty = "0.9.0"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
serde_json = "1"
serialport = { version = "4.10.1", default-features = false }
sha2 = "0.11"
smb = "0.10"
suppaftp = { version = "12", features = ["deprecated", "tokio", "tokio-rustls-ring"] }
termwiz = { version = "0.23.3", default-features = false }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
trash = "5.2.9"
webpki-roots = "1.0.9"
zeroize = "1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
