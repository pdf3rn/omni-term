[package]
name = "omni-term"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
arboard = "3.7.0"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
directories = "6.0.0"
eframe = "0.37.0"
getrandom = "0.4.3"
keyring = "4.2.0"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
russh = "0.64.1"
termwiz = { version = "0.23.3", default-features = false }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
zeroize = "1.9.1"
