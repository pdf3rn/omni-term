name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: windows-latest, target: windows-x86_64 }
          - { os: macos-14, target: macos-arm64 }
          - { os: macos-13, target: macos-x86_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked

      - name: Empaquetar (Linux y macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="omni-term-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/omni-term "dist/$name/"
          cp README.md "dist/$name/"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp -r packaging "dist/$name/packaging"
            cp packaging/install-linux.sh "dist/$name/install.sh"
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "omni-term-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/release/omni-term.exe "dist/$name/"
          Copy-Item README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: omni-term-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Publicar
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
