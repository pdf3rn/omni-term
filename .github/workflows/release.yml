name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: windows-latest, target: windows-x86_64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev desktop-file-utils

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con Cargo.toml (v${version})" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="omni-term-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/omni-term "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -r packaging "dist/$name/packaging"
          cp packaging/install-linux.sh "dist/$name/install.sh"
          chmod +x "dist/$name/install.sh"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Instalar cargo-deb (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Paquete .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="omni-term-${GITHUB_REF_NAME}-${{ matrix.target }}"
          cargo deb --no-build --locked -o "dist/$name.deb"

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="omni-term-${GITHUB_REF_NAME}-${{ matrix.target }}"
          appdir=AppDir
          install -Dm755 target/release/omni-term "$appdir/usr/bin/omni-term"
          install -Dm644 packaging/omni-term.desktop "$appdir/usr/share/applications/omni-term.desktop"
          install -Dm644 packaging/icons/256x256/omni-term.png "$appdir/usr/share/icons/hicolor/256x256/apps/omni-term.png"
          cp packaging/omni-term.desktop "$appdir/omni-term.desktop"
          cp packaging/icons/256x256/omni-term.png "$appdir/omni-term.png"
          ln -s usr/bin/omni-term "$appdir/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" "dist/$name.AppImage"

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="omni-term-${GITHUB_REF_NAME}-${{ matrix.target }}"
          app="dist/$name/omni-term.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/release/omni-term "$app/MacOS/"
          cp packaging/omni-term.icns "$app/Resources/"
          version="${GITHUB_REF_NAME#v}"
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>omni-term</string>
            <key>CFBundleDisplayName</key><string>omni-term</string>
            <key>CFBundleIdentifier</key><string>io.github.pdf3rn.omni-term</string>
            <key>CFBundleExecutable</key><string>omni-term</string>
            <key>CFBundleIconFile</key><string>omni-term</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          xattr -cr "dist/$name/omni-term.app"
          codesign --force --deep --sign - "dist/$name/omni-term.app"
          # Acceso directo a Applications dentro del propio volumen: arrastrar-para-instalar.
          ln -s /Applications "dist/$name/Applications"
          hdiutil create -volname "omni-term" -srcfolder "dist/$name" -ov -format UDZO "dist/$name.dmg"

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "omni-term-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/release/omni-term.exe "dist/$name/"
          Copy-Item README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $name = "omni-term-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$PWD\target\release" "/DOutputDir=$PWD\dist" "/DOutputName=$name-setup" packaging\omni-term.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir .tar.gz
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omni-term-${{ matrix.target }}-tar
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Subir .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omni-term-${{ matrix.target }}-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Subir AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omni-term-${{ matrix.target }}-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Subir instalador
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: omni-term-${{ matrix.target }}-setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Subir .zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: omni-term-${{ matrix.target }}-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Subir .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: omni-term-${{ matrix.target }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: Publicar
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Sumas SHA-256
        working-directory: dist
        run: sha256sum *.tar.gz *.deb *.AppImage *.zip *.exe *.dmg > SHA256SUMS

      - name: Atestación de procedencia
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.zip
            dist/*.exe
            dist/*.dmg
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
