name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: windows-latest, target: windows-x86_64 }
          - { os: macos-14, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con Cargo.toml (v${version})" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="omni-term-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/omni-term "dist/$name/"
          cp README.md "dist/$name/"
          cp -r packaging "dist/$name/packaging"
          cp packaging/install-linux.sh "dist/$name/install.sh"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="omni-term-${GITHUB_REF_NAME}-${{ matrix.target }}"
          app="dist/$name/omni-term.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/release/omni-term "$app/MacOS/"
          cp packaging/omni-term.icns "$app/Resources/"
          version="${GITHUB_REF_NAME#v}"
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>omni-term</string>
            <key>CFBundleDisplayName</key><string>omni-term</string>
            <key>CFBundleIdentifier</key><string>io.github.pdf3rn.omni-term</string>
            <key>CFBundleExecutable</key><string>omni-term</string>
            <key>CFBundleIconFile</key><string>omni-term</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          xattr -cr "dist/$name/omni-term.app"
          codesign --force --deep --sign - "dist/$name/omni-term.app"
          # Acceso directo a Applications dentro del propio volumen: arrastrar-para-instalar.
          ln -s /Applications "dist/$name/Applications"
          hdiutil create -volname "omni-term" -srcfolder "dist/$name" -ov -format UDZO "dist/$name.dmg"

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "omni-term-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/release/omni-term.exe "dist/$name/"
          Copy-Item README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: omni-term-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg

  publish:
    name: Publicar
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Sumas SHA-256
        working-directory: dist
        run: sha256sum *.tar.gz *.zip *.dmg > SHA256SUMS

      - name: Atestación de procedencia
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
