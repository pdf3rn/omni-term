name: Audit

on:
  push:
    branches: [main, master]
    paths: [Cargo.toml, Cargo.lock]
  pull_request:
    paths: [Cargo.toml, Cargo.lock]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
