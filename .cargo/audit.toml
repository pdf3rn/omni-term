[advisories]
# RUSTSEC-2023-0071 (Marvin attack on `rsa`): no fixed release exists. The crate arrives through
# russh (RSA SSH keys) and smb → sspi → picky (NTLM/Kerberos). The attack needs precise timing of
# private-key operations by a network observer. Remove this entry when `rsa` ships a fix.
#
# RUSTSEC-2026-0387 (timing variability in `crypto-bigint`): the fix is only in >=0.7.6, but the
# 0.5.5 copy is pinned by `elliptic-curve` 0.13 (p256/p384/p521 → picky → sspi → smb). The other
# copies are already patched. Remove this entry when picky/sspi move to a patched elliptic-curve.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]
